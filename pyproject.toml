[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fast-array-dataloader"
version = "1.0.0"
description = "Zero-Copy, High-Performance DataLoader for PyTorch - 10-40x faster than standard DataLoader"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Simon Bertrand", email = "simonbertrand.contact@gmail.com"}
]
maintainers = [
    {name = "Simon Bertrand", email = "simonbertrand.contact@gmail.com"}
]
keywords = [
    "pytorch",
    "dataloader",
    "deep-learning",
    "hpc",
    "zero-copy",
    "shared-memory",
    "performance",
    "machine-learning"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "numpy>=1.20.0",
    "torch>=1.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=3.0.0",
]

[project.urls]
Homepage = "https://github.com/yourusername/FastArrayDataLoader"
Documentation = "https://github.com/yourusername/FastArrayDataLoader#readme"
Repository = "https://github.com/yourusername/FastArrayDataLoader"
Issues = "https://github.com/yourusername/FastArrayDataLoader/issues"

[tool.setuptools]
packages = ["fast_array_dataloader"]

[tool.setuptools.package-data]
fast_array_dataloader = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v"
console_output_style = "progress"

[tool.black]
line-length = 120
target-version = ["py38", "py39", "py310", "py311"]

[tool.isort]
profile = "black"
line_length = 120

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
